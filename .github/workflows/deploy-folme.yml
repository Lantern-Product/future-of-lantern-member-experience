# On every push to main, trigger a sync in roadmap-ama. That repo pushes to
# its own main, and Vercel auto-deploys production → folme.lantern.codes.
#
# ONE-TIME SETUP (repo admin):
#   Add repository secret ROADMAP_AMA_SYNC_TOKEN — a fine-grained PAT (or GitHub
#   App token) with read on this repo and write on Lantern-Product/roadmap-ama.

name: Deploy to folme.lantern.codes

on:
  push:
    branches: [main]

concurrency:
  group: deploy-folme
  cancel-in-progress: true

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync to roadmap-ama
        env:
          GH_TOKEN: ${{ secrets.ROADMAP_AMA_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ROADMAP_AMA_SYNC_TOKEN secret is not configured."
            exit 1
          fi
          # #region agent log
          echo "dispatch_start sha=${GITHUB_SHA:0:7} ref=${GITHUB_REF_NAME}"
          # #endregion
          payload=$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF_NAME" \
            '{event_type:"sync-folme", client_payload:{source_sha:$sha, source_ref:$ref}}')
          gh api --method POST repos/Lantern-Product/roadmap-ama/dispatches --input - <<<"$payload"
          # #region agent log
          echo "dispatch_ok sha=${GITHUB_SHA:0:7}"
          # #endregion
